# para ejecutar: SPRING_PROFILES_ACTIVE=dev-snapshot ./mvnw spring-boot:run
# postgres local persistente (volumen nombrado): sobrevive a `docker compose down` y a reinicios,
# pensado para restaurar ahi un dump de dev y probar migraciones antes de aplicarlas en dev de verdad
services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    volumes:
      - pgdata_dump:/var/lib/postgresql/data

volumes:
  pgdata_dump:
