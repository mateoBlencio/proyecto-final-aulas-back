name: CI

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - test
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      security-events: write
    env:
      IMAGE: siga-back:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload reports
        if: always()
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3
        with:
          action: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
          attempt_limit: 3
          attempt_delay: 10000
          with: |
            name: reports-${{ github.run_id }}-${{ github.run_attempt }}
            path: |
              target/surefire-reports/
              target/site/jacoco/
              target/spring-modulith-docs/
            if-no-files-found: ignore
            retention-days: 7

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6
        with:
          report_paths: target/surefire-reports/TEST-*.xml
          detailed_summary: true
          fail_on_failure: false

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Trivy cache key
        id: trivy-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy DB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.trivy-key.outputs.date }}
          restore-keys: trivy-db-

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Free disk space
        if: always()
        run: |
          docker image rm -f "$IMAGE" || true
          docker builder prune -f --filter until=168h
