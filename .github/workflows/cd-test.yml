name: CD — test

on:
  push:
    branches:
      - test

jobs:
  test:
    name: Tests
    runs-on: self-hosted
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: testdb
      DB_USERNAME: test
      DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw test -Dspring.profiles.active=integration

  deploy-test:
    name: Deploy — backend-test
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        run: |
          docker compose -f docker-compose.deploy.yml --profile test \
            --env-file /home/adminmate/proyecto-aulas/proyecto-final-aulas-back/.env \
            up -d --build

      - name: Health check
        run: |
          container="proyecto-final-aulas-back-backend-test-1"
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$container")
            echo "Intento $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "El contenedor no llegó a healthy a tiempo"
          docker logs "$container" --tail 50
          exit 1
