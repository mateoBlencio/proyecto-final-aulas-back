spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  docker:
    compose:
      enabled: false

cors:
  allowed-origins:
    - http://localhost:5173

siga:
  jwt:
    secret: integration-test-fixed-secret-not-for-prod-0123456789
    refresh-grace-seconds: 10
