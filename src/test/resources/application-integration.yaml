spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///siga?TC_DAEMON=true
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  # El schema lo arma Flyway, no Hibernate: es la unica corrida automatica que prueba las
  # migraciones. validate falla si una entidad no coincide con lo que dicen los .sql.
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  docker:
    compose:
      enabled: false

management:
  health:
    mail:
      enabled: false

cors:
  allowed-origins:
    - http://localhost:5173

siga:
  dashboard:
    snapshot:
      enabled: false
  audit:
    archive:
      enabled: false
  solver:
    unimproved-seconds-limit: 1
  jwt:
    secret: integration-test-fixed-secret-not-for-prod-0123456789
    refresh-grace-seconds: 10
  sysacad:
    enabled: false
    api-key: integration-test-unused
  camera-count:
    enabled: false
  # Los contextos cacheados comparten el Postgres: con el intervalo por defecto (PT1M) el reintento de
  # cualquiera de ellos puede reclamar filas que otro test está por reclamar. La corrida al arrancar
  # el contexto sigue ocurriendo; el test que lo necesita mockea NotificationRetryScheduler.
  notifications:
    retry-interval: PT1H
