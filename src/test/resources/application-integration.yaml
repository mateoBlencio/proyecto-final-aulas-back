spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///siga?TC_DAEMON=true
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop

  docker:
    compose:
      enabled: false

cors:
  allowed-origins:
    - http://localhost:5173

siga:
  solver:
    unimproved-seconds-limit: 1
  jwt:
    secret: integration-test-fixed-secret-not-for-prod-0123456789
    refresh-grace-seconds: 10
