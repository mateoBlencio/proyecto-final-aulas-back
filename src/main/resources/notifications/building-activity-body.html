<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<title th:text="${edificio}">Movimientos de aula</title>
<style>
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
  body { margin: 0; padding: 0; width: 100% !important; background-color: #eef2f7; }
  @media screen and (max-width: 600px) {
    .email-container { width: 100% !important; }
    .px-32 { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#eef2f7;">

  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#eef2f7;" th:text="${resumen}">
    Preheader
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#eef2f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;width:100%;background-color:#ffffff;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;">

          <tr style="display: flex; flex-direction: row; align-items: center; justify-content: space-between">
            <td class="px-32" align="left" style="padding:20px 32px;border-bottom:1px solid #e5e5e5;">
              <img src="cid:logoSiga" alt="Sistema Inteligente de Gestión Áulica" width="140" style="display:block;border:0;max-width:140px;height:auto;" />
            </td>
            <td class="px-32" align="right" style="padding:20px 32px;border-bottom:1px solid #e5e5e5;">
              <img src="cid:logoUtnFrc" alt="UTN Facultad Regional Córdoba" width="140" style="display:block;border:0;max-width:140px;height:auto;" />
            </td>
          </tr>

          <tr>
            <td class="px-32" align="left" style="padding:28px 32px;background-color:#1538b8;">
              <h1 style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:26px;font-weight:700;color:#ffffff;" th:text="${'Movimientos de aula en ' + edificio}">
                Título del banner
              </h1>
            </td>
          </tr>

          <tr>
            <td class="px-32" style="padding:28px 32px 4px 32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:22px;color:#191919;">
              Hola:
            </td>
          </tr>
          <tr>
            <td class="px-32" style="padding:8px 32px 0 32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:22px;color:#374151;" th:text="${resumen}">
              Resumen
            </td>
          </tr>
          <tr th:if="${not #strings.isEmpty(motivo)}">
            <td class="px-32" style="padding:12px 32px 0 32px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#374151;">
              <strong style="color:#191919;">Motivo:</strong> <span th:text="${motivo}">Motivo</span>
            </td>
          </tr>
          <tr>
            <td class="px-32" style="padding:20px 32px 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #e5e5e5;">
                <tr th:each="linea : ${lineas}"><td style="padding:10px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#191919;" th:text="${linea}">Materia, fecha y horario: aula anterior a aula nueva</td></tr>
                <tr th:if="${restantes > 0}"><td style="padding:10px 0 0 0;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#6b7280;" th:text="${'y ' + restantes + ' más, que podés ver en SIGA'}">y 12 más</td></tr>
                <tr><td style="padding:0 0 16px 0;"></td></tr>
              </table>
            </td>
          </tr>

          <tr>
            <td class="px-32" style="padding:28px 32px 0 32px;">
              <hr style="border:none;border-top:1px solid #e5e5e5;margin:0;" />
            </td>
          </tr>
          <tr>
            <td class="px-32" style="padding:16px 32px 32px 32px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#6b7280;">
              No respondas este mail. Los movimientos completos están en la sección Movimientos de SIGA.
            </td>
          </tr>

        </table>

        <table role="presentation" class="email-container" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
          <tr>
            <td align="center" style="padding:16px 12px;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;color:#9ca3af;">
              UTN Facultad Regional Córdoba | Sistema de Gestión de Aulas (SIGA)
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
