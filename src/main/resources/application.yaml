spring:
  application:
    name: siga

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  docker:
    compose:
      enabled: false

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

  api-docs:
    enabled: false
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ""

siga:
  api:
    # Prefijo de versión de la API. Bump solo ante breaking change de contrato.
    base-path: /v1
  solver:
    # Solves concurrentes del SolverManager; excedentes se encolan. AUTO = según cores.
    parallel-solver-count: AUTO
    # Corta el solve si el mejor score no mejora en N segundos (0 = deshabilitado).
    unimproved-seconds-limit: 10
    # PHASE_ASSERT (default Timefold, reproducible); FULL_ASSERT solo para debugging.
    environment-mode: PHASE_ASSERT

logging:
  level:
    root: WARN
    ar.edu.utn.frc.siga: INFO