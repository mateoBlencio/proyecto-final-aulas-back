spring:
  application:
    name: siga

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
      org:
        hibernate:
          envers:
            store_data_at_delete: true

  docker:
    compose:
      enabled: false

server:
  servlet:
    context-path: /api
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

  api-docs:
    enabled: false
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ""

siga:
  api:
    base-path: /v1
  settings:
    definitions:
      - key: optimizer.unimprovedSecondsLimit
        default-value: "10"
        min: "0"
        max: "3600"
      - key: optimizer.weights.overcrowding
        default-value: "100000"
        min: "0"
        max: "1000000"
      - key: optimizer.weights.sameCommissionDiffRoom
        default-value: "2000"
        min: "0"
        max: "1000000"
      - key: optimizer.weights.sameCommissionDiffBuilding
        default-value: "4000"
        min: "0"
        max: "1000000"
      - key: optimizer.weights.unusedCapacity
        default-value: "1"
        min: "0"
        max: "1000000"
      - key: optimizer.solverSecondsSpentLimit
        default-value: "300"
        min: "1"
        max: "3600"
      - key: preview.defaultTimeLimitSeconds
        default-value: "30"
        min: "1"
        max: "3600"
      - key: preview.ttlMinutes
        default-value: "30"
        min: "1"
        max: "1440"
      - key: events.hours.start
        default-value: "08:00"
      - key: events.hours.end
        default-value: "23:00"
  optimizer:
    parallel-solver-count: AUTO
    environment-mode: PHASE_ASSERT
  space:
    default-classroom-type: Normal
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:20}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:10}
  auth:
    allowed-email-domain: ${AUTH_ALLOWED_EMAIL_DOMAIN:frc.utn.edu.ar}
  login-ratelimit:
    max-attempts: 5
    window-minutes: 15
  ratelimit:
    general:
      capacity: 100
      refill-period-seconds: 60
  sysacad:
    enabled: ${SYSACAD_ENABLED}

    # TEMPORAL: sirve un fixture estático en vez de la vista real. Eliminar cuando esté completa.
    asignaciones-mock-enabled: true

    base-url: https://dataview.frc.utn.edu.ar
    api-key: ${SYSACAD_API_KEY}
    connect-timeout: 5s
    read-timeout: 30s
    max-retries: 3
    sync:

      buildings: "0 0 3 * * SUN"
      classrooms: "0 0 3 * * SUN"
      specialties: "0 0 3 * * SUN"
      events: "0 0 3 * * SUN"
      allocations: "0 0 3 * * SUN"
      subjects: "0 0 3 * * SUN"
      commissions: "0 0 3 * * SUN"

logging:
  level:
    root: WARN
    ar.edu.utn.frc.siga: INFO
    ai.timefold.solver.core.impl.solver: INFO
    ai.timefold.solver.core.impl.constructionheuristic: INFO
    ai.timefold.solver.core.impl.localsearch: INFO