spring:
  application:
    name: siga

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  docker:
    compose:
      enabled: false

server:
  servlet:
    context-path: /api
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

  api-docs:
    enabled: false
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: ""

siga:
  api:
    base-path: /v1
  solver:
    parallel-solver-count: AUTO
    unimproved-seconds-limit: 1000
    environment-mode: PHASE_ASSERT
    preview:
      ttl-minutes: 30
    weights:
      overcrowding: 100000
      same-commission-diff-room: 2000
      same-commission-diff-building: 4000
  space:
    default-classroom-type: Normal
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:20}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    refresh-grace-seconds: ${JWT_REFRESH_GRACE_SECONDS:10}
  auth:
    allowed-email-domain: ${AUTH_ALLOWED_EMAIL_DOMAIN:frc.utn.edu.ar}
  login-ratelimit:
    max-attempts: 5
    window-minutes: 15
  ratelimit:
    general:
      capacity: 100
      refill-period-seconds: 60

logging:
  level:
    root: WARN
    ar.edu.utn.frc.siga: INFO
    # Fases del solver (construction heuristic / local search) y resumen de score de Timefold.
    ai.timefold.solver.core.impl.solver: INFO
    ai.timefold.solver.core.impl.constructionheuristic: INFO
    ai.timefold.solver.core.impl.localsearch: INFO