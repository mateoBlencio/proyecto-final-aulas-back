spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

  mail:
    host: ${MAIL_HOST:mailhog-test}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

siga:
  notifications:
    email:
      enabled: ${MAIL_ENABLED:true}
      from: ${MAIL_FROM:no-reply@siga.local}

logging:
  level:
    ar.edu.utn.frc.siga: DEBUG
    org.springframework.web: INFO
