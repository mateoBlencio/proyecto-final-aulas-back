spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

siga:
  notifications:
    email:
      enabled: ${MAIL_ENABLED:true}
      from: ${MAIL_FROM:no-reply@siga.local}

logging:
  level:
    ar.edu.utn.frc.siga: DEBUG
    org.springframework.web: INFO
