spring:
  jpa:
    show-sql: false
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8089,http://100.90.179.1:8082,http://100.90.179.1

logging:
  level:
    ar.edu.utn.frc.siga: DEBUG
    org.springframework.web: INFO
