spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

springdoc:
  swagger-ui:
    enabled: true

  api-docs:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    ar.edu.utn.frc.classroom_allocation: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
