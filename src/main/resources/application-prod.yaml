spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    ar.edu.utn.frc.siga: INFO
  structured:
    format:
      console: ecs

siga:
  audit:
    archive:
      enabled: ${AUDIT_ARCHIVE_ENABLED:true}
