spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
  docker:
    compose:
      enabled: true
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173

siga:
  jwt:
    secret: dev-local-fixed-secret-not-for-prod-0123456789abcdef

logging:
  level:
    ar.edu.utn.frc.siga: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
