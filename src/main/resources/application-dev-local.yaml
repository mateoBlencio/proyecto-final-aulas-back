spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: secret
  docker:
    compose:
      enabled: true
      stop:
        command: down

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false
  flyway:
    enabled: false

  sql:
    init:
      mode: always
      encoding: UTF-8
  jpa:
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: update

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173

siga:
  jwt:
    # Random per run unless JWT_SECRET is set (tokens do not survive restarts); no secret is versioned
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
  sysacad:
    enabled: false
    api-key: dev-local-unused
  notifications:
    email:
      enabled: true
      from: no-reply@siga.local

logging:
  level:
    ar.edu.utn.frc.siga: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
