services:
  backend-dev:
    build: .
    profiles: ["dev"]
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres_dev
      DB_PORT: 5432
      DB_NAME: database_dev
      DB_USERNAME: back_user_dev
      DB_PASSWORD: ${BACK_USER_DEV_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-20}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      JWT_REFRESH_GRACE_SECONDS: ${JWT_REFRESH_GRACE_SECONDS:-10}
    ports:
      - "8080:8080"
    networks:
      - app-network

  backend-test:
    build: .
    profiles: ["test"]
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: test
      DB_HOST: postgres_test
      DB_PORT: 5432
      DB_NAME: database_test
      DB_USERNAME: back_user_test
      DB_PASSWORD: ${BACK_USER_TEST_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-20}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      JWT_REFRESH_GRACE_SECONDS: ${JWT_REFRESH_GRACE_SECONDS:-10}
    ports:
      - "8081:8080"
    networks:
      - app-network

networks:
  app-network:
    external: true
