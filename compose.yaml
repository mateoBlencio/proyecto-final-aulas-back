# para ejecutar: SPRING_PROFILES_ACTIVE=compose ./mvnw spring-boot:run
# despliega base de datos postgress en contenedor local
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
