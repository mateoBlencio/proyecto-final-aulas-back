# para ejecutar: SPRING_PROFILES_ACTIVE=dev-local ./mvnw spring-boot:run
# levanta un postgres local efímero (datos se pierden al detener la app)
services:
  postgres:
    image: 'postgres:16-alpine'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '127.0.0.1:5432:5432'

  mailhog:
    image: 'mailhog/mailhog:v1.0.1'
    ports:
      - '1025:1025'
      - '8025:8025'
