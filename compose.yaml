# para ejecutar: SPRING_PROFILES_ACTIVE=dev-local ./mvnw spring-boot:run
# levanta un postgres local efímero (datos se pierden al detener la app)
services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
